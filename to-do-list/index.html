<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>To Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <h1>Lista de tarefas</h1>

    <button class="btn-abrir-modal" onclick="abrirModal()">Nova tarefa +</button>

    <div class="formulario-fundo" id="modal">
        <div class="formulario">
            <button class="btn-fechar-modal" onclick="fecharModal()">X</button>
            <h2 id="tituloModal">Nova tarefa</h2>

            <label>Nome</label>
            <input type="text" placeholder="Crie um nome para a tarefa" id="nome">

            <div>
                <div class="input">
                    <label>Categoria</label>
                    <select name="Categoria" id="categoria">
                        <option>Trabalho</option>
                        <option>Família</option>
                        <option>Estudo</option>
                        <option>Atividade física</option>
                    </select>
                </div>
                <div class="input">
                    <label>Prioridade</label>
                    <select name="Prioridade" id="prioridade">
                        <option>Alta</option>
                        <option>Média</option>
                        <option>Baixa</option>
                    </select>
                </div>
            </div>
            <div class="input">
                <label>Prazo</label>
                <input type="date" id="prazo">
            </div>
            <button class="btn-cadastro" onclick="cadastrarTarefa()">Cadastrar tarefa</button>
        </div>
    </div>

    <div class="container">
        <div class="botoes">
            <div class="input">
                <label>Categoria</label>
                <select id="filtroCategoria">
                    <option value="">Todas</option>
                    <option>Trabalho</option>
                    <option>Estudo</option>
                    <option>Família</option>
                    <option>Saúde</option>
                </select>
            </div>
            <div class="input">
                <label>Prioridade</label>
                <select id="filtroPrioridade">
                    <option value="">Todas</option>
                    <option>Alta</option>
                    <option>Média</option>
                    <option>Baixa</option>
                </select>
            </div>
        </div>
        <table class="tabela">
            <thead>
                <tr>
                    <th>Tarefa</th>
                    <th>Prioridade</th>
                    <th>Categoria</th>
                    <th>Prazo</th>
                    <th>Ações</th>
                    <th>Marcar como concluída</th>
                </tr>
                <tbody id="lista-tarefas"></tbody>
            </thead>
        </table>

    </div>
    </div>

    <script src="scripts.js"></script>

</body>

</html>
